name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_ONLY_OUTPUT_ROOT: "/__w/_temp"
  SOURCE_ONLY_UNZIP_PACKAGE: "unzip=6.0-28ubuntu4.1"
  SOURCE_ONLY_UNZIP_PACKAGE_SHA256: "a505b9d491386167bd8e14e3383315a4a7d6539e4406745901ccf009a7988271"

jobs:
  source-only-python:
    name: source-only (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # One release per supported Python minor; the legs run in parallel.
        python-version:
          - "3.14.8"
          - "3.15.0"
    container:
      # The one copy of the image pin. The env aliases below and scripts/source_only_ci.py
      # read it from here, so an image update changes only this line.
      image: &source-only-image "mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf"
    env:
      SOURCE_ONLY_USERSPACE_IMAGE: *source-only-image
      SOURCE_ONLY_EXECUTED_IMAGE: *source-only-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned host bootstrap prerequisite
        shell: bash
        run: |
          apt-get update -qq
          apt-get download "$SOURCE_ONLY_UNZIP_PACKAGE"
          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'unzip_*.deb' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            printf 'expected one pinned unzip package, found %s\n' \
              "${#packages[@]}" >&2
            exit 1
          fi
          printf '%s  %s\n' \
            "$SOURCE_ONLY_UNZIP_PACKAGE_SHA256" "${packages[0]}" |
            sha256sum --check --strict
          dpkg --install "${packages[0]}"
          test "$(dpkg-query --showformat='${Version}' --show unzip)" = \
            "${SOURCE_ONLY_UNZIP_PACKAGE#unzip=}"
          rm -- "${packages[0]}"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Resolve pinned Chromium
        shell: bash
        run: |
          mapfile -t candidates < <(
            find /ms-playwright -type f \
              -path '*/chrome-linux*/chrome' -print | sort
          )
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            printf 'expected one pinned Chromium executable, found %s\n' \
              "${#candidates[@]}" >&2
            exit 1
          fi
          printf 'BENCH_CHROMIUM_EXECUTABLE=%s\n' \
            "${candidates[0]}" >> "$GITHUB_ENV"
      - run: >-
          python scripts/source_only_ci.py
          --output "$SOURCE_ONLY_OUTPUT_ROOT/source-only-ci-receipt.json"
          --browser-output
          "$SOURCE_ONLY_OUTPUT_ROOT/source-only-browser-receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-only-ci-browser-receipts-python-${{ matrix.python-version }}
          path: |
            ${{ env.SOURCE_ONLY_OUTPUT_ROOT }}/source-only-ci-receipt.json
            ${{ env.SOURCE_ONLY_OUTPUT_ROOT }}/source-only-browser-receipt.json
            ${{ env.SOURCE_ONLY_OUTPUT_ROOT }}/source-only-browser-result.json
            ${{ env.SOURCE_ONLY_OUTPUT_ROOT }}/source-only-ci-receipt-logs
            ${{ env.SOURCE_ONLY_OUTPUT_ROOT }}/source-only-methodology.json
            ${{ env.SOURCE_ONLY_OUTPUT_ROOT }}/private-prerelease-audit

  # The ruleset requires one check named source-only. It passes only when every Python leg passed,
  # so the required check does not change when a leg is added or its pin moves.
  source-only:
    needs: source-only-python
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require every Python leg to pass
        env:
          LEGS_RESULT: ${{ needs.source-only-python.result }}
        run: test "$LEGS_RESULT" = success
