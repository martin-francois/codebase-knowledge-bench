name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.3"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: python scripts/source_only_ci.py --output "$RUNNER_TEMP/source-only-ci-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-only-ci-receipt
          path: |
            ${{ runner.temp }}/source-only-ci-receipt.json
            ${{ runner.temp }}/source-only-ci-receipt-logs
            ${{ runner.temp }}/source-only-methodology.json
